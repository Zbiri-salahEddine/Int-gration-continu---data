name: CD

# Déploie sur la machine virtuelle uniquement après une CI réussie sur main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploiement-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://pipeline:e2e-postgres@127.0.0.1:5434/transactions
      S3_ENDPOINT: http://127.0.0.1:8334
      S3_ACCESS_KEY: e2e-access
      S3_SECRET_KEY: e2e-secret
      INTERVALLE_SECONDES: "3"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Déployer la stack de production sur le runner
        run: ENV_FILE=deploy/e2e.env sh deploy/deploy.sh

      - name: Tester la stack de bout en bout
        run: pytest tests/e2e -v

      - name: Journaux des services
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file deploy/e2e.env logs --tail 100

  verifier-vm:
    needs: e2e
    runs-on: ubuntu-latest
    environment: production
    outputs:
      configuree: ${{ steps.verification.outputs.configuree }}
    steps:
      - name: Vérifier que la VM de production est configurée
        id: verification
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          if [ -n "$VM_HOST" ]; then
            echo "configuree=true" >> "$GITHUB_OUTPUT"
          else
            echo "configuree=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret VM_HOST absent : le déploiement sur la VM est ignoré."
          fi

  deploiement:
    needs: verifier-vm
    if: needs.verifier-vm.outputs.configuree == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VM: ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurer SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploiement)
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'IdentityFile ~/.ssh/id_deploiement\n' > ~/.ssh/config

      - name: Générer le fichier d'environnement
        env:
          VERSION: ${{ github.event.workflow_run.head_sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          umask 077
          {
            echo "VERSION=$VERSION"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "S3_ACCESS_KEY=$S3_ACCESS_KEY"
            echo "S3_SECRET_KEY=$S3_SECRET_KEY"
            echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD"
          } > .env

      - name: Copier le projet sur la VM
        run: |
          tar czf - docker-compose.prod.yml Dockerfile .dockerignore requirements.txt pipeline sql s3 grafana \
            deploy/deploy.sh .env | ssh "$VM" 'mkdir -p ~/pipeline-de && tar xzf - -C ~/pipeline-de'

      - name: Construire l'image et déployer sur la VM
        run: ssh "$VM" 'cd ~/pipeline-de && sh deploy/deploy.sh'
